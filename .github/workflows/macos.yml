name: macos

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Mac architecture to build and test on
        type: choice
        default: macos-15
        options:
          - macos-15
          - macos-15-intel

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}-${{ inputs.runner }}
  cancel-in-progress: false

# `just macos-lint` covers Clippy, so these jobs build each profile once, in parallel.
jobs:
  install:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          tools: rust just buf cargo-binstall
          cache-name: macos-install-${{ inputs.runner }}
      - name: Build and install Tufo.app
        id: install
        run: just install
      - name: Smoke-test the installed executables
        run: just smoke "$HOME/Applications/Tufo.app/Contents/MacOS"
      - name: Show the server log
        if: ${{ failure() }}
        run: cat "$HOME/Library/Application Support/tufo/tufo-server.log" || true
      - name: Check the bundle's signature
        run: codesign --verify --deep --strict "$HOME/Applications/Tufo.app"
      - name: Pack the bundle
        run: mkdir -p .artifacts && ditto -c -k --keepParent "$HOME/Applications/Tufo.app" .artifacts/Tufo.app.zip
      - name: Upload the bundle
        uses: actions/upload-artifact@v7
        with:
          name: tufo-${{ inputs.runner }}-${{ github.sha }}
          path: .artifacts/Tufo.app.zip
          if-no-files-found: error
          retention-days: 7
      - name: Stop the installed server
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: '"$HOME/.local/bin/tufo" server kill'
      - name: Uninstall
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: just uninstall

  test:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          tools: rust buf cargo-binstall cargo:cargo-nextest
          cache-name: macos-test-${{ inputs.runner }}
      # The engine player's timing assertions are too tight for hosted macOS runners.
      - name: Test the workspace
        run: cargo nextest run --no-fail-fast -E 'not binary_id(tufo-infra::engine_player)'
