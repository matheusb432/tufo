[package]
name = "tufo-gui"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[features]
benchmark = ["dep:clap", "dep:serde_json"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, optional = true }
clru = { workspace = true }
directories = { workspace = true }
fastrand = { workspace = true }
gettext = "0.4.0"
image = { workspace = true }
jiff = { workspace = true }
rfd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
slint = { workspace = true }
sys-locale = "0.3.2"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tufo-application = { workspace = true }
tufo-client = { workspace = true }
tufo-local-transport = { workspace = true }
tufo-models = { workspace = true }
unicode-normalization = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }
mpris-server = "0.10.0"
wayland-backend = { workspace = true }
wayland-client = { workspace = true }
ksni = { workspace = true }
resvg = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
resvg = { workspace = true }
souvlaki = { version = "0.8.3", default-features = false }
tray-icon = { workspace = true }

[target.'cfg(windows)'.dependencies]
souvlaki = { version = "0.8.3", default-features = false }
tray-icon = { workspace = true }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tonic = { workspace = true }
tempfile = { workspace = true }

[build-dependencies]
embed-resource = { workspace = true }
slint-build = { workspace = true }
rspolib = "0.1.2"

[lints]
workspace = true
