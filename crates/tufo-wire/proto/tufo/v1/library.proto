syntax = "proto3";

package tufo.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// The playlists and soundboards, the songs, and the audio files they point at. Tufo never
// copies, moves, or writes audio files.
service LibraryService {
  // Streams the whole library, then the whole library again after each change. A slow reader
  // skips to the latest snapshot. The stream ends when the server shuts down.
  rpc WatchLibrary(WatchLibraryRequest) returns (stream WatchLibraryResponse);
  // Imports folders and audio files dropped on the playlists or soundboards grid. Each folder
  // becomes a followed library folder, and each folder under it that holds audio becomes a
  // linked collection. Loose audio files become one manual collection. The library snapshot
  // shows the result once this returns.
  rpc ImportPaths(ImportPathsRequest) returns (ImportPathsResponse);
  // Adds every audio file among the paths, and under the folders among them, to one manual
  // collection. Linked collections refuse with FAILED_PRECONDITION.
  rpc AddFilesToCollection(AddFilesToCollectionRequest) returns (AddFilesToCollectionResponse);
  // Creates an empty manual collection.
  rpc CreateCollection(CreateCollectionRequest) returns (CreateCollectionResponse);
  // Changes the fields present in the request and leaves the others.
  rpc UpdateCollection(UpdateCollectionRequest) returns (UpdateCollectionResponse);
  // Deletes a collection; its songs stay in the library. A deleted linked collection stays
  // deleted until its folder is imported again, while Tufo keeps following the folder.
  rpc DeleteCollection(DeleteCollectionRequest) returns (DeleteCollectionResponse);
  // Changes the fields present in the request and leaves the others.
  rpc UpdateCollectionEntry(UpdateCollectionEntryRequest) returns (UpdateCollectionEntryResponse);
  // Deletes an entry from a manual collection. Linked collections refuse with
  // FAILED_PRECONDITION, since their folder decides their entries.
  rpc DeleteCollectionEntry(DeleteCollectionEntryRequest) returns (DeleteCollectionEntryResponse);
  // Adds songs to a hand-picked playlist, skipping the songs it already lists. NOT_FOUND names
  // an unknown playlist or song; linked playlists refuse with FAILED_PRECONDITION.
  rpc AddSongsToPlaylist(AddSongsToPlaylistRequest) returns (AddSongsToPlaylistResponse);
  // Removes a song added by its own path from the songs; playlists that list it keep it. A song
  // a followed folder holds refuses with FAILED_PRECONDITION.
  rpc DeleteSong(DeleteSongRequest) returns (DeleteSongResponse);
  // Stops following a folder: deletes its linked collections and forgets the files under it
  // that nothing else keeps. Hand-picked collections keep listing its files.
  rpc DeleteLibraryFolder(DeleteLibraryFolderRequest) returns (DeleteLibraryFolderResponse);
  // Rescans every library folder now instead of waiting for the watcher.
  rpc RescanLibrary(RescanLibraryRequest) returns (RescanLibraryResponse);
  // Starts or resumes a saved import. Work continues after the request returns and is bounded
  // to five minutes per attempt. Conflicts require an explicit keep/overwrite choice.
  rpc ImportKenkuLibrary(ImportKenkuLibraryRequest) returns (ImportKenkuLibraryResponse);
  // Sends the latest saved import immediately, then coalesced progress and its durable result.
  // Disconnecting a watcher does not cancel the import. Ends when the server shuts down.
  rpc WatchKenkuImport(WatchKenkuImportRequest) returns (stream WatchKenkuImportResponse);
}

message WatchLibraryRequest {}

message WatchLibraryResponse {
  LibrarySnapshot snapshot = 1;
}

message LibrarySnapshot {
  // Increases with every change.
  uint64 revision = 1;
  // Playlists, then soundboards, each by title.
  repeated Collection collections = 2;
  // By title.
  repeated Song songs = 3;
  // By path.
  repeated LibraryFolder library_folders = 4;
}

// An audio file a song source keeps in the library: a followed music folder, or the file's own
// path added to a playlist.
message Song {
  // A canonical UUID, the audio file's.
  string audio_file_id = 1;
  string title = 2;
  optional BuiltinTitle builtin_title = 3;
  // The file's absolute path.
  string path = 4;
  google.protobuf.Duration duration = 5;
  // When the file was added to Tufo.
  google.protobuf.Timestamp added_at = 6;
  // Whether Tufo last looked for the file and didn't find it.
  bool missing = 7;
  // A followed folder wins over the file's own path.
  oneof source {
    // A canonical UUID, the library folder holding the file.
    string library_folder_id = 8;
    FileSongSource file = 9;
  }
}

// The file was added to a playlist by its own path.
message FileSongSource {}

// A folder Tufo follows.
message LibraryFolder {
  // A canonical UUID.
  string id = 1;
  CollectionKind kind = 2;
  string folder_path = 3;
}

message Collection {
  // A canonical UUID.
  string id = 1;
  CollectionKind kind = 2;
  string title = 3;
  Background background = 4;
  EntryOrder order = 5;
  oneof source {
    ManualSource manual = 6;
    LinkedSource linked = 7;
  }
  // In the collection's order.
  repeated CollectionEntry entries = 8;
  optional BuiltinTitle builtin_title = 9;
}

enum CollectionKind {
  COLLECTION_KIND_UNSPECIFIED = 0;
  COLLECTION_KIND_PLAYLIST = 1;
  COLLECTION_KIND_SOUNDBOARD = 2;
}

message Background {
  oneof kind {
    // A gradient derived from the collection's id.
    GradientBackground gradient = 1;
    // An absolute path to an image file.
    string image_path = 2;
    // A painting that ships with Tufo.
    BackgroundPreset preset = 3;
  }
}

message GradientBackground {}

enum BackgroundPreset {
  BACKGROUND_PRESET_UNSPECIFIED = 0;
  BACKGROUND_PRESET_AUTUMN = 1;
  BACKGROUND_PRESET_BATTLE = 2;
  BACKGROUND_PRESET_CASTLE = 3;
  BACKGROUND_PRESET_CATHEDRAL = 4;
  BACKGROUND_PRESET_COAST = 5;
  BACKGROUND_PRESET_DESERT = 6;
  BACKGROUND_PRESET_DRAGON = 7;
  BACKGROUND_PRESET_FIRE = 8;
  BACKGROUND_PRESET_FOREST = 9;
  BACKGROUND_PRESET_HAUNTED = 10;
  BACKGROUND_PRESET_MOUNTAIN = 11;
  BACKGROUND_PRESET_NIGHT = 12;
  BACKGROUND_PRESET_SKY = 13;
  BACKGROUND_PRESET_SKULLS = 14;
  BACKGROUND_PRESET_STORM = 15;
  BACKGROUND_PRESET_TAVERN = 16;
  BACKGROUND_PRESET_TOWN = 17;
  BACKGROUND_PRESET_UNDERWORLD = 18;
  BACKGROUND_PRESET_VOLCANO = 19;
  BACKGROUND_PRESET_WINTER = 20;
}

message EntryOrder {
  EntryOrderKey key = 1;
  bool descending = 2;
}

enum EntryOrderKey {
  ENTRY_ORDER_KEY_UNSPECIFIED = 0;
  ENTRY_ORDER_KEY_TITLE = 1;
  ENTRY_ORDER_KEY_DURATION = 2;
  // When the file was added to Tufo.
  ENTRY_ORDER_KEY_DATE_ADDED = 3;
}

// Entries added by hand.
message ManualSource {}

// The audio files one folder holds directly.
message LinkedSource {
  string folder_path = 1;
  // Whether Tufo last looked for the folder and didn't find it.
  bool missing = 2;
}

message CollectionEntry {
  // A canonical UUID.
  string id = 1;
  // A canonical UUID, shared by every entry of the same file.
  string audio_file_id = 2;
  string title = 3;
  // The file's absolute path.
  string path = 4;
  google.protobuf.Duration duration = 5;
  // When the file was added to Tufo.
  google.protobuf.Timestamp added_at = 6;
  // Whether Tufo last looked for the file and didn't find it.
  bool missing = 7;
  SoundSettings sound = 8;
  SoundIcon icon = 9;
  optional BuiltinTitle builtin_title = 10;
}

// How an entry plays as a sound effect.
message SoundSettings {
  bool looping = 1;
  // A linear gain from 0 (silence) to 1 (the file's own level).
  float volume = 2;
  // At most one minute.
  google.protobuf.Duration fade_in = 3;
  // At most one minute.
  google.protobuf.Duration fade_out = 4;
}

