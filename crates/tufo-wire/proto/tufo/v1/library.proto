message ImportPathsRequest {
  CollectionKind kind = 1;
  // Absolute paths of folders or audio files.
  repeated string paths = 2;
}

message ImportPathsResponse {
  ImportReport report = 1;
}

// What an import changed, for the message the GUI shows.
message ImportReport {
  uint32 collections_created = 1;
  uint32 files_added = 2;
  // Audio files Tufo couldn't read, left out.
  repeated string unreadable_paths = 3;
  // Dropped paths that are neither folders nor audio files.
  repeated string ignored_paths = 4;
}

message AddFilesToCollectionRequest {
  string collection_id = 1;
  // Absolute paths of folders or audio files.
  repeated string paths = 2;
}

message AddFilesToCollectionResponse {
  ImportReport report = 1;
}

message CreateCollectionRequest {
  CollectionKind kind = 1;
  string title = 2;
  Background background = 3;
}

message CreateCollectionResponse {
  string collection_id = 1;
}

message UpdateCollectionRequest {
  string collection_id = 1;
  optional string title = 2;
  optional Background background = 3;
  optional EntryOrder order = 4;
}

message UpdateCollectionResponse {}

message DeleteCollectionRequest {
  string collection_id = 1;
}

message DeleteCollectionResponse {}

message UpdateCollectionEntryRequest {
  string collection_entry_id = 1;
  // Retitles the audio file everywhere it appears.
  optional string title = 2;
  optional SoundSettings sound = 3;
  optional SoundIcon icon = 4;
}

message UpdateCollectionEntryResponse {}

message DeleteCollectionEntryRequest {
  string collection_entry_id = 1;
}

message DeleteCollectionEntryResponse {}

message AddSongsToPlaylistRequest {
  string playlist_id = 1;
  // Canonical UUIDs of audio files; at least one.
  repeated string audio_file_ids = 2;
}

message AddSongsToPlaylistResponse {
  // Songs the playlist didn't list before.
  uint32 songs_added = 1;
}

message DeleteSongRequest {
  string audio_file_id = 1;
}

message DeleteSongResponse {}

message DeleteLibraryFolderRequest {
  string library_folder_id = 1;
}

message DeleteLibraryFolderResponse {}

message RescanLibraryRequest {}

message RescanLibraryResponse {}

message ImportKenkuLibraryRequest {
  // Absolute; absent means Kenku FM's default folder on the server's system.
  optional string kenku_folder_path = 1;
  optional string import_id = 2;
  repeated KenkuCollectionChoice choices = 3;
}

message ImportKenkuLibraryResponse {
  reserved 1;
  string import_id = 2;
}

message KenkuCollectionChoice {
  string source_id = 1;
  CollectionKind kind = 2;
  bool overwrite = 3;
}

message WatchKenkuImportRequest {}

message WatchKenkuImportResponse {
  // Absent until the first import.
  KenkuImportStatus status = 1;
}

message KenkuImportStatus {
  string import_id = 1;
  KenkuImportState state = 2;
  // Rough estimate from 0 to 100. Updated by stage, rather than by audio packet or file.
  uint32 progress_percent = 3;
  repeated KenkuImportConflict conflicts = 4;
  KenkuImportReport report = 5;
  optional string error_reason = 6;
}

enum KenkuImportState {
  KENKU_IMPORT_STATE_UNSPECIFIED = 0;
  KENKU_IMPORT_STATE_READING = 1;
  KENKU_IMPORT_STATE_AWAITING_CHOICES = 2;
  KENKU_IMPORT_STATE_IMPORTING = 3;
  KENKU_IMPORT_STATE_SUCCEEDED = 4;
  KENKU_IMPORT_STATE_FAILED = 5;
  KENKU_IMPORT_STATE_INTERRUPTED = 6;
}

message KenkuImportConflict {
  string source_id = 1;
  CollectionKind kind = 2;
  string incoming_title = 3;
  string existing_title = 4;
}

// What importing Kenku FM's library changed, for the message the GUI shows.
message KenkuImportReport {
  uint32 collections_imported = 1;
  uint32 files_imported = 2;
  // Collections the user chose to keep.
  repeated string skipped_collection_titles = 3;
  // Audio files that couldn't be found or read.
  repeated string unreadable_paths = 4;
  // Web addresses, which can't play.
  repeated string unsupported_sources = 5;
  // The bot logs in with it after the server restarts.
  bool discord_bot_token_imported = 6;
}

// A generated display title. The English title remains available to non-GUI clients.
enum BuiltinTitle {
  BUILTIN_TITLE_UNSPECIFIED = 0;
  BUILTIN_TITLE_EFFECTS = 1;
  BUILTIN_TITLE_IMPORTED = 2;
  BUILTIN_TITLE_RAIN = 3;
  BUILTIN_TITLE_STORM = 4;
  BUILTIN_TITLE_WIND = 5;
  BUILTIN_TITLE_WAVES = 6;
  BUILTIN_TITLE_STREAM = 7;
  BUILTIN_TITLE_BIRDS = 8;
  BUILTIN_TITLE_SUMMER_NIGHT = 9;
  BUILTIN_TITLE_FIREPLACE = 10;
}
