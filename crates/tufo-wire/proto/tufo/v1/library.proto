  SOUND_ICON_CLOUD_FOG = 16;
  SOUND_ICON_CLOUD_LIGHTNING = 17;
  SOUND_ICON_CLOUD_RAIN = 18;
  SOUND_ICON_CLOUD_SNOW = 19;
  SOUND_ICON_COFFEE = 20;
  SOUND_ICON_COINS = 21;
  SOUND_ICON_CROWN = 22;
  SOUND_ICON_DICES = 23;
  SOUND_ICON_DOG = 24;
  SOUND_ICON_DOOR_OPEN = 25;
  SOUND_ICON_DROPLETS = 26;
  SOUND_ICON_DRUM = 27;
  SOUND_ICON_FAN = 28;
  SOUND_ICON_FISH = 29;
  SOUND_ICON_FLAME = 30;
  SOUND_ICON_FLAME_KINDLING = 31;
  SOUND_ICON_FLASK_CONICAL = 32;
  SOUND_ICON_FOOTPRINTS = 33;
  SOUND_ICON_GHOST = 34;
  SOUND_ICON_GUITAR = 35;
  SOUND_ICON_HAMMER = 36;
  SOUND_ICON_HEART_PULSE = 37;
  SOUND_ICON_HOURGLASS = 38;
  SOUND_ICON_HOUSE = 39;
  SOUND_ICON_KEY = 40;
  SOUND_ICON_LANDMARK = 41;
  SOUND_ICON_MOON = 42;
  SOUND_ICON_MOON_STAR = 43;
  SOUND_ICON_MOUNTAIN = 44;
  SOUND_ICON_MOUNTAIN_SNOW = 45;
  SOUND_ICON_MUSIC = 46;
