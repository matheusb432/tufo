syntax = "proto3";

package tufo.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "tufo/v1/library.proto";

// Plays a music queue with up to two extra songs and any number of sound effects on one output.
service PlayerService {
  // Streams the player state, then each change. Positions are samples: add the time since
  // position_sampled_at while the music plays. A slow reader skips to the latest state. The
  // stream ends when the server shuts down.
  rpc WatchPlayer(WatchPlayerRequest) returns (stream WatchPlayerResponse);
  // Replaces the music with a playlist's tracks, in the playlist's order, starting at one of
  // them. Missing files are skipped.
  rpc PlayCollection(PlayCollectionRequest) returns (PlayCollectionResponse);
  // Plays one playlist song alongside the main queue. The first song becomes the main track
  // when there is no queue. At most three songs play; adding an active song is a no-op.
  rpc AddMusicLayer(AddMusicLayerRequest) returns (AddMusicLayerResponse);
  // Fades out one song; stopping the main track also drops its playlist queue.
  // Stopping an absent song succeeds.
  rpc StopMusicLayer(StopMusicLayerRequest) returns (StopMusicLayerResponse);
  // Changes only the settings present. An absent extra song is ignored.
  rpc UpdateMusicLayer(UpdateMusicLayerRequest) returns (UpdateMusicLayerResponse);
  // Queues a playlist song after the songs already queued, from any playlist; the playlist
  // continues after them. Plays the song now when no music plays. Queuing a queued song leaves it
  // in place. FAILED_PRECONDITION while one track repeats.
  rpc AddToQueue(AddToQueueRequest) returns (AddToQueueResponse);
  // Takes a song out of the queue. Removing a song that isn't queued succeeds.
  rpc RemoveFromQueue(RemoveFromQueueRequest) returns (RemoveFromQueueResponse);
  // Pauses every music layer. FAILED_PRECONDITION when nothing plays.
  rpc PauseMusic(PauseMusicRequest) returns (PauseMusicResponse);
  // Resumes every music layer. FAILED_PRECONDITION when nothing plays.
  rpc ResumeMusic(ResumeMusicRequest) returns (ResumeMusicResponse);
  // Fades every music layer out and drops the queue. Stopping silence succeeds.
  rpc StopMusic(StopMusicRequest) returns (StopMusicResponse);
  // Crossfades to the queue's next track.
  rpc SkipToNextTrack(SkipToNextTrackRequest) returns (SkipToNextTrackResponse);
  // Goes back a track, or restarts the current one after its first 5 s.
  rpc SkipToPreviousTrack(SkipToPreviousTrackRequest) returns (SkipToPreviousTrackResponse);
  // Moves the current track to a position.
  rpc SeekMusic(SeekMusicRequest) returns (SeekMusicResponse);
  // Changes the settings present in the request and leaves the others. Repeating one track is
  // FAILED_PRECONDITION while songs are queued.
  rpc UpdatePlayerSettings(UpdatePlayerSettingsRequest) returns (UpdatePlayerSettingsResponse);
  // Fires one soundboard entry over the music, restarting it when it already plays.
  rpc PlaySound(PlaySoundRequest) returns (PlaySoundResponse);
  // Fades a playing sound out. Stopping a silent entry succeeds.
  rpc StopSound(StopSoundRequest) returns (StopSoundResponse);
  // Holds every playing sound where it is, leaving the music alone. Pausing silence succeeds.
  rpc PauseSounds(PauseSoundsRequest) returns (PauseSoundsResponse);
  // Continues the paused sounds. PlaySound also resumes them.
  rpc ResumeSounds(ResumeSoundsRequest) returns (ResumeSoundsResponse);
  // Plays the looping sounds left playing on the local device, unless they were left paused.
  rpc ResumeSavedLoops(ResumeSavedLoopsRequest) returns (ResumeSavedLoopsResponse);
  // Routes all audio to the local device or one Discord voice channel, carrying the music at its
  // position and the looping sounds over. Selecting the active output does nothing.
  rpc SelectOutput(SelectOutputRequest) returns (SelectOutputResponse);
  // Starts one local output recovery attempt. Concurrent retries and a ready output are no-ops.
  // WatchPlayer reports completion or failure. FAILED_PRECONDITION unless Local is selected.
  rpc RecoverLocalOutput(RecoverLocalOutputRequest) returns (RecoverLocalOutputResponse);
  // Fades out the music and every sound, then closes the audio device and leaves any voice
  // channel until something plays again. The GUI calls it when quitting leaves the server running.
  rpc StandBy(StandByRequest) returns (StandByResponse);
  // Playback health totals since the server started.
  rpc GetPlayerDiagnostics(GetPlayerDiagnosticsRequest) returns (GetPlayerDiagnosticsResponse);
  // Plays a draft loop on the local device while the stream stays open, from a frame or
  // repeating both sides of its seam. Music playing on the local device pauses meanwhile and
  // resumes afterwards. A newer preview ends this one.
  rpc PreviewSongLoop(PreviewSongLoopRequest) returns (stream PreviewSongLoopResponse);
  // Starts the browser, which restores the tabs it last had open; its status turns open once it
  // serves BrowserService. Opening a starting or open browser succeeds. UNAVAILABLE when this
  // installation has no browser or it cannot start.
  rpc OpenBrowser(OpenBrowserRequest) returns (OpenBrowserResponse);
  // Saves the open tabs, then ends the browser and every page process it started. Closing a
  // closed browser succeeds.
  rpc CloseBrowser(CloseBrowserRequest) returns (CloseBrowserResponse);
}

message WatchPlayerRequest {}

message WatchPlayerResponse {
  PlayerState state = 1;
}

message PlayerState {
  Output output = 1;
  VoiceConnection voice = 2;
  // Absent while no music plays.
  optional MusicState music = 3;
  float volume = 4;
  bool muted = 5;
  bool shuffle = 6;
  RepeatMode repeat = 7;
  google.protobuf.Duration crossfade = 8;
  repeated ActiveSound sounds = 9;
  bool sounds_paused = 10;
  // At most two extra songs, accompanying the main playlist track.
  repeated MusicLayerState music_layers = 11;
  // The songs added to the queue, in the order they play. With repeat on, a queued song that
  // plays now is last, since it comes around again.
  repeated string queued_collection_entry_ids = 12;
  // Multiplies every effect's individual volume, independently of music volume and mute.
  float effects_volume = 13;
  BrowserPlayback browser = 14;
  LocalOutputHealth local_output = 15;
}

message LocalOutputHealth {
  oneof state {
    LocalOutputReleased released = 1;
    LocalOutputIdentity ready = 2;
    LocalOutputRecovering recovering = 3;
    LocalOutputFailure failed = 4;
  }
}

message LocalOutputReleased {}

message LocalOutputIdentity {
  string backend = 1;
  optional string device = 2;
  optional uint32 sample_rate = 3;
}

message LocalOutputRecovering {
  optional LocalOutputFailure previous_failure = 1;
}

message LocalOutputFailure {
  LocalOutputFailureReason reason = 1;
  optional LocalOutputIdentity identity = 2;
  // Diagnostic context for the CLI. GUIs translate reason and never display this field.
  string detail = 3;
}

enum LocalOutputFailureReason {
  LOCAL_OUTPUT_FAILURE_REASON_UNSPECIFIED = 0;
  LOCAL_OUTPUT_FAILURE_REASON_NO_DEVICE = 1;
  LOCAL_OUTPUT_FAILURE_REASON_TARGET_MISSING = 2;
  LOCAL_OUTPUT_FAILURE_REASON_DEVICE_UNAVAILABLE = 3;
  LOCAL_OUTPUT_FAILURE_REASON_STREAM_INVALIDATED = 4;
  LOCAL_OUTPUT_FAILURE_REASON_DEVICE_CHANGED = 5;
  LOCAL_OUTPUT_FAILURE_REASON_CALLBACK_STOPPED = 6;
  LOCAL_OUTPUT_FAILURE_REASON_OPEN_FAILED = 7;
  LOCAL_OUTPUT_FAILURE_REASON_OPEN_TIMED_OUT = 8;
}

// The browser's part in playback.
message BrowserPlayback {
  BrowserStatus status = 1;
  // A linear gain from 0 to 1 for every page's audio, independent of music and effects.
  float volume = 2;
  bool muted = 3;
  // Some page sends audio now.
  bool audible = 4;
}

// Whether the browser runs. Stopped statuses closed without a request; opening clears them.
enum BrowserStatus {
  BROWSER_STATUS_UNSPECIFIED = 0;
  BROWSER_STATUS_CLOSED = 1;
  BROWSER_STATUS_STARTING = 2;
  BROWSER_STATUS_OPEN = 3;
  // No page played and no view showed the browser for a while, so it released its memory.
  BROWSER_STATUS_STOPPED_IDLE = 4;
  BROWSER_STATUS_STOPPED_CRASHED = 5;
  BROWSER_STATUS_STOPPED_START_FAILED = 6;
  // This installation has no browser.
  BROWSER_STATUS_STOPPED_UNAVAILABLE = 7;
}

message MusicLayerState {
  MusicState music = 1;
  float volume = 2;
  bool looping = 3;
}

message MusicState {
  string collection_id = 1;
  string collection_entry_id = 2;
  string title = 3;
  google.protobuf.Duration position = 4;
  google.protobuf.Timestamp position_sampled_at = 5;
  // Absent when the track's length is unknown.
  optional google.protobuf.Duration duration = 6;
  bool paused = 7;
  // The track's absolute path.
  string path = 8;
  // A canonical UUID.
  string audio_file_id = 9;
  // The loop the track started with; the position wraps from its loop end to its loop start.
  optional SongLoop loop = 10;
}

message ActiveSound {
  string collection_entry_id = 1;
  google.protobuf.Timestamp started_at = 2;
  google.protobuf.Duration duration = 3;
  bool looping = 4;
}

enum RepeatMode {
  REPEAT_MODE_UNSPECIFIED = 0;
  REPEAT_MODE_OFF = 1;
  REPEAT_MODE_PLAYLIST = 2;
  REPEAT_MODE_TRACK = 3;
}

// The state of the bot's voice connection.
message VoiceConnection {
  oneof state {
    VoiceNotConfigured not_configured = 1;
    VoiceDisconnected disconnected = 2;
    VoiceConnecting connecting = 3;
    VoiceConnected connected = 4;
    VoiceReconnecting reconnecting = 5;
    VoiceDisabled disabled = 6;
  }
}

message VoiceNotConfigured {}

message VoiceDisconnected {
  optional string reason = 1;
}

message VoiceConnecting {}

message VoiceConnected {}

message VoiceReconnecting {
  uint32 attempt = 1;
}

// The bot is configured but its Discord connection is disabled, so it can't join a channel.
message VoiceDisabled {}

// Where the server sends audio.
message Output {
  oneof target {
    LocalOutput local = 1;
    DiscordVoiceOutput discord_voice = 2;
  }
}

// The server machine's default audio device.
message LocalOutput {}

// One Discord voice channel, joined by the server's bot.
message DiscordVoiceOutput {
  fixed64 guild_id = 1;
  fixed64 channel_id = 2;
}

message PlayCollectionRequest {
  string collection_id = 1;
  // The entry to start from; the collection's first playable entry when absent.
  optional string start_collection_entry_id = 2;
}

message PlayCollectionResponse {}

message AddMusicLayerRequest {
  string collection_entry_id = 1;
}

message AddMusicLayerResponse {}

message StopMusicLayerRequest {
  string collection_entry_id = 1;
}

message StopMusicLayerResponse {}

message UpdateMusicLayerRequest {
  string collection_entry_id = 1;
  // A linear gain from 0 to 1.
  optional float volume = 2;
  optional bool looping = 3;
}

message UpdateMusicLayerResponse {}

message AddToQueueRequest {
  string collection_entry_id = 1;
}

message AddToQueueResponse {}

message RemoveFromQueueRequest {
  string collection_entry_id = 1;
}

message RemoveFromQueueResponse {}

message PauseMusicRequest {}

message PauseMusicResponse {}

message ResumeMusicRequest {}

message ResumeMusicResponse {}

message StopMusicRequest {}

message StopMusicResponse {}

message SkipToNextTrackRequest {}

message SkipToNextTrackResponse {}

message SkipToPreviousTrackRequest {}

message SkipToPreviousTrackResponse {}

message SeekMusicRequest {
  google.protobuf.Duration position = 1;
}

message SeekMusicResponse {}

message UpdatePlayerSettingsRequest {
  // A linear gain from 0 to 1.
  optional float volume = 1;
  optional bool muted = 2;
  optional bool shuffle = 3;
  optional RepeatMode repeat = 4;
  // At most 10 s; 0 plays gaplessly.
  optional google.protobuf.Duration crossfade = 5;
  // A linear multiplier from 0 to 1 for every effect's individual volume.
  optional float effects_volume = 6;
  // A linear gain from 0 to 1 for every page's audio.
  optional float browser_volume = 7;
  optional bool browser_muted = 8;
}

message UpdatePlayerSettingsResponse {}

message PlaySoundRequest {
  string collection_entry_id = 1;
}

message PlaySoundResponse {}

message StopSoundRequest {
  string collection_entry_id = 1;
}

message StopSoundResponse {}

message PauseSoundsRequest {}

message PauseSoundsResponse {}

message ResumeSoundsRequest {}

message ResumeSoundsResponse {}

message ResumeSavedLoopsRequest {}

message ResumeSavedLoopsResponse {}

message SelectOutputRequest {
  Output output = 1;
}

message SelectOutputResponse {}

message RecoverLocalOutputRequest {}

message RecoverLocalOutputResponse {}

message StandByRequest {}

message StandByResponse {}

message GetPlayerDiagnosticsRequest {}

message GetPlayerDiagnosticsResponse {
  PlayerDiagnostics diagnostics = 1;
}

message PlayerDiagnostics {
  // Frames of silence music playback inserted because a decoder fell behind.
  uint64 music_underrun_frames = 1;
  // Absent without Discord.
  optional VoicePacing voice_pacing = 2;
  // Frames of silence streamed effects inserted because a decoder fell behind.
  uint64 sound_underrun_frames = 3;
  // Local output stream errors reported by CPAL, across output changes.
  uint64 local_stream_errors = 4;
  // Local stream errors lost when CPAL or Kira's error queues filled.
  uint64 local_stream_errors_discarded = 5;
  // Frames of silence browser audio inserted because a page's packets arrived late.
  uint64 browser_underrun_frames = 6;
  // Browser frames discarded because they arrived faster than the output played them, or while
  // the output changed.
  uint64 browser_dropped_frames = 7;
}

// How late songbird ran its 20 ms voice ticks.
message VoicePacing {
  uint64 ticks = 1;
  // Ticks more than 5 ms late.
  uint64 late_ticks = 2;
  // Ticks more than 20 ms late.
  uint64 very_late_ticks = 3;
  google.protobuf.Duration lateness_p50 = 4;
  google.protobuf.Duration lateness_p99 = 5;
  google.protobuf.Duration lateness_p999 = 6;
  google.protobuf.Duration lateness_max = 7;
}

message PreviewSongLoopRequest {
  string audio_file_id = 1;
  string source_fingerprint = 2;
  SongLoop draft = 3;
  oneof mode {
    PreviewFromFrame from_frame = 4;
    PreviewSeam seam = 5;
  }
}

// Plays the draft as the song would, wrapping at its loop end.
message PreviewFromFrame {
  uint64 start_frame = 1;
}

// Repeats the audio before the loop end, the seam, and the audio after the loop start.
message PreviewSeam {
  // Each side of the seam, at most 10 s.
  google.protobuf.Duration side = 1;
}

// Sent once, when the preview starts.
message PreviewSongLoopResponse {
  google.protobuf.Timestamp started_at = 1;
  // How long one seam repetition lasts, including the silence after it.
  optional google.protobuf.Duration seam_cycle = 2;
}

message OpenBrowserRequest {}

message OpenBrowserResponse {}

message CloseBrowserRequest {}

message CloseBrowserResponse {}
