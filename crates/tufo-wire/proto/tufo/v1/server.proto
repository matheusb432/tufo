syntax = "proto3";

package tufo.v1;

import "google/protobuf/duration.proto";

// The server process itself.
service ServerService {
  // Reads process and Discord status without exposing credentials or starting playback.
  rpc GetServerStatus(GetServerStatusRequest) returns (GetServerStatusResponse);
  // Drains the server and exits it, stopping all audio. The response arrives before the drain.
  rpc StopServer(StopServerRequest) returns (StopServerResponse);
  // Saves the Discord bot token to the server's private credentials file. The server reads the
  // file when it starts, so the token applies after a restart.
  rpc SetDiscordBotToken(SetDiscordBotTokenRequest) returns (SetDiscordBotTokenResponse);
}

message GetServerStatusRequest {}

message GetServerStatusResponse {
  string version = 1;
  uint32 process_id = 2;
  google.protobuf.Duration uptime = 3;
  DiscordBotTokenStatus discord_bot_token = 4;
  DiscordConnectionStatus discord_connection = 5;
}

// The saved token file, which may differ from the running bot's configuration until a restart.
enum DiscordBotTokenStatus {
  DISCORD_BOT_TOKEN_STATUS_UNSPECIFIED = 0;
  DISCORD_BOT_TOKEN_STATUS_MISSING = 1;
  DISCORD_BOT_TOKEN_STATUS_CONFIGURED = 2;
  DISCORD_BOT_TOKEN_STATUS_INVALID = 3;
}

enum DiscordConnectionStatus {
  DISCORD_CONNECTION_STATUS_UNSPECIFIED = 0;
  DISCORD_CONNECTION_STATUS_NOT_CONFIGURED = 1;
  DISCORD_CONNECTION_STATUS_CONNECTING = 2;
  DISCORD_CONNECTION_STATUS_READY = 3;
}

message StopServerRequest {}

message StopServerResponse {}

message SetDiscordBotTokenRequest {
  string bot_token = 1;
}

message SetDiscordBotTokenResponse {}
