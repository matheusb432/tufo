[package]
name = "tufo-local-transport"
version = "0.1.0"
description = "Private local IPC between the process roots"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "time"] }
tonic = { workspace = true, features = ["transport"] }

[target.'cfg(unix)'.dependencies]
directories = { workspace = true }
libc = { workspace = true }
tokio-stream = { workspace = true, features = ["net"] }

[target.'cfg(windows)'.dependencies]
futures = { workspace = true }
hyper-util = { workspace = true, features = ["tokio"] }
tower = { workspace = true, features = ["util"] }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "rt"] }

[lints]
workspace = true
